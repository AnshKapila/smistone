<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>body { background: #333; padding: 50px; }</style>
</head>
<body>
<svg class="w-full h-auto drop-shadow-xl" viewBox="0 0 750 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 800px;">
  <rect width="750" height="300" fill="#FFFFFF" rx="8" />

  <!-- Layer 1: BACKING -->
  <path d="M 160 90 L 320 30 L 480 90 L 320 150 Z" fill="#151515" stroke="#000000" stroke-width="1"/>
  
  <!-- Layer 2: FIBERGLASS -->
  <path d="M 120 100 L 280 40 L 440 100 L 280 160 Z" fill="#E5E5E5" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Layer 3: ADHESIVE -->
  <path d="M 80 110 L 240 50 L 400 110 L 240 170 Z" fill="#47331F" stroke="#B98857" stroke-width="1"/>
  
  <!-- Layer 4: NATURAL STONE LAYER -->
  <path d="M 40 120 L 200 60 L 360 120 L 200 180 Z" fill="#F3F2F0" stroke="#D1D1D1" stroke-width="1"/>

  <!-- Connecting Lines & Labels -->
  <!-- Stone -->
  <circle cx="280" cy="90" r="4" fill="#151515"/>
  <path d="M 280 90 L 320 50 L 550 50" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="560" y="54" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">NATURAL STONE LAYER</text>

  <!-- Adhesive -->
  <circle cx="360" cy="125" r="4" fill="#151515"/>
  <path d="M 360 125 L 380 100 L 550 100" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="560" y="104" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">ADHESIVE</text>

  <!-- Fiberglass -->
  <circle cx="400" cy="145" r="4" fill="#151515"/>
  <path d="M 400 145 L 420 150 L 550 150" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="560" y="154" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">FIBERGLASS</text>

  <!-- Backing -->
  <circle cx="440" cy="165" r="4" fill="#151515"/>
  <path d="M 440 165 L 460 200 L 550 200" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="560" y="204" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">BACKING</text>
</svg>
</body>
</html>
