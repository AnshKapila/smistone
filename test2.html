<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>body { background: #333; padding: 50px; }</style>
</head>
<body>
<svg class="w-full h-auto drop-shadow-xl" viewBox="0 0 650 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 800px;">
  <rect width="650" height="300" fill="#FFFFFF" rx="8" />

  <!-- Layer 1: BACKING -->
  <path d="M 160 90 L 320 30 L 480 90 L 320 150 Z" fill="#151515" stroke="#000000" stroke-width="1"/>
  
  <!-- Layer 2: FIBERGLASS -->
  <path d="M 120 100 L 280 40 L 440 100 L 280 160 Z" fill="#E5E5E5" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Layer 3: ADHESIVE -->
  <path d="M 80 110 L 240 50 L 400 110 L 240 170 Z" fill="#47331F" stroke="#B98857" stroke-width="1"/>
  
  <!-- Layer 4: NATURAL STONE LAYER -->
  <path d="M 40 120 L 200 60 L 360 120 L 200 180 Z" fill="#F3F2F0" stroke="#D1D1D1" stroke-width="1"/>

  <!-- Connecting Lines & Labels -->
  <!-- Stone -->
  <circle cx="200" cy="120" r="4" fill="#151515"/>
  <path d="M 200 120 L 440 190" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="194" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">NATURAL STONE LAYER</text>

  <!-- Adhesive -->
  <circle cx="370" cy="115" r="4" fill="#151515"/>
  <path d="M 370 115 L 440 115" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="119" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">ADHESIVE</text>

  <!-- Fiberglass -->
  <circle cx="410" cy="105" r="4" fill="#151515"/>
  <path d="M 410 105 L 440 105" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="109" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">FIBERGLASS</text>

  <!-- Backing -->
  <circle cx="450" cy="95" r="4" fill="#151515"/>
  <path d="M 450 95 L 490 95" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="500" y="99" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">BACKING</text>
</svg>
</body>
</html>
