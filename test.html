<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>body { background: #333; padding: 50px; }</style>
</head>
<body>
<svg class="w-full h-auto drop-shadow-xl" viewBox="0 0 650 300" fill="none" xmlns="http://www.w3.org/2000/svg" style="max-width: 800px;">
  <!-- Background is white plain as requested -->
  <rect width="650" height="300" fill="#FFFFFF" rx="8" />

  <!-- Layer 1: BACKING -->
  <path d="M 40 240 L 380 240 L 440 100 L 100 100 Z" fill="#151515" stroke="#000000" stroke-width="1"/>
  
  <!-- Layer 2: FIBERGLASS -->
  <path d="M 40 240 L 320 240 L 380 100 L 100 100 Z" fill="#E5E5E5" stroke="#CCCCCC" stroke-width="1"/>
  
  <!-- Layer 3: ADHESIVE -->
  <path d="M 40 240 L 260 240 L 320 100 L 100 100 Z" fill="#47331F" stroke="#B98857" stroke-width="1"/>
  
  <!-- Layer 4: NATURAL STONE LAYER -->
  <path d="M 40 240 L 200 240 L 260 100 L 100 100 Z" fill="#F3F2F0" stroke="#D1D1D1" stroke-width="1"/>
  
  <!-- Connecting Lines & Labels -->
  <!-- Stone -->
  <circle cx="215" cy="130" r="4" fill="#151515"/>
  <path d="M 215 130 L 440 130" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="134" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">NATURAL STONE LAYER</text>

  <!-- Adhesive -->
  <circle cx="275" cy="160" r="4" fill="#151515"/>
  <path d="M 275 160 L 440 160" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="164" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">ADHESIVE</text>

  <!-- Fiberglass -->
  <circle cx="335" cy="190" r="4" fill="#151515"/>
  <path d="M 335 190 L 440 190" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="194" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">FIBERGLASS</text>

  <!-- Backing -->
  <circle cx="395" cy="220" r="4" fill="#151515"/>
  <path d="M 395 220 L 440 220" stroke="#151515" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="450" y="224" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#151515" letter-spacing="1">BACKING</text>
</svg>
</body>
</html>
